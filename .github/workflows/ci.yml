# Gate de CI do repositório (C-18).
#
# O projeto inteiro sustenta que RIPD é gate de CI, não documento pós-fato — e o
# repositório não tinha gate nenhum. Este é o mínimo: tipos e testes, rodando em
# todo push e em todo pull request, sem nenhuma etapa tolerante a falha.
#
# Enquanto o job `verificacao` não estiver marcado como *required status check*
# na proteção da branch `main`, este arquivo é conselho e não regra: ele informa
# o vermelho e não impede o merge. A marcação é configuração do repositório, não
# commit — instruções no corpo do PR que introduziu o gate.
#
# Este é o gate mínimo do repositório: prova que compila e que as 9 regras
# continuam passando. Ele não verifica nada sobre dado pessoal. O gate de
# privacidade que o produto descreve — varredura de PII em log, catálogo
# declarado, checklist PbD lido pelo pipeline — é o PR 11 do MAPA-PROCESSOS.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo cancela a execução anterior da mesma referência: fila de CI que
# roda commit velho atrasa o retorno sem melhorar a garantia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    # O sufixo vem da matriz e é **vazio** no leg Ubuntu, de propósito: o check
    # continua se chamando exatamente `Tipos e testes`, que é o nome já marcado
    # como *required* na proteção da `main`. Matriz sem isto renomearia para
    # `Tipos e testes (ubuntu-latest)` e derrubaria a marcação no mesmo instante;
    # matriz com `name` estático daria nomes **idênticos** aos dois legs, e aí o
    # verde de um mascararia o vermelho do outro na proteção de branch.
    #
    # O leg Windows entra como check novo, marcável pelo dono quando quiser — e
    # até lá informa o vermelho sem impedir merge, como todo check novo aqui.
    name: Tipos e testes${{ matrix.sufixo }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Um leg vermelho não cancela o outro. Com `fail-fast` no padrão, o Windows
      # falhando cancelaria o Ubuntu no meio, e um *required check* em `cancelled`
      # bloqueia o merge sem dizer o que quebrou — vermelho pelo motivo errado.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sufixo: '' }
          - { os: windows-latest, sufixo: ' (windows)' }
    defaults:
      run:
        # O protótipo vive em app/. O restante do repositório é esquema, API e
        # documentação, sem cadeia de build própria.
        working-directory: app

    steps:
      # `fetch-depth: 0` porque a suíte confere história, e não só arquivos.
      #
      # A reconciliação da auditoria (RIPD §7.1, coluna "Fechado por") cita o
      # commit que fechou cada risco, e o bloco `PR 27` verifica que cada sha
      # existe e é ancestral do commit sob teste — é o que protege contra typo
      # numa citação e contra um squash futuro que trocaria os shas sem ninguém
      # reler uma tabela de 40 linhas.
      #
      # O padrão de `actions/checkout` é profundidade 1. Num clone raso essa
      # prova não teria como falhar: passaria por não ter olhado, que é o
      # Risco-003 com outro nome. O teste reprova o clone raso em vez de se
      # adaptar a ele, e esta linha é o que o mantém verde por ter história.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache das dependências pelo lockfile do app.
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o lockfile e falha se
      # ele estiver fora de sincronia com o package.json.
      - name: Instalar dependências
        run: npm ci

      # Medida, e não afirmação. `core.autocrlf` é configuração do ambiente, não
      # do repositório: o runner Windows pode entregá-lo em `true`, e uma versão
      # futura do `actions/checkout` pode mudar isso sem avisar. A etapa roda nas
      # duas plataformas e imprime a mesma forma nas duas — é o que permite
      # comparar as duas colunas do log em vez de acreditar em uma delas.
      #
      # Não reprova: CRLF na árvore não é defeito, porque a primeira camada (o
      # `split(/\r?\n/)` de cada leitor) existe para tolerá-lo. Sai diferente de
      # zero só se não conseguiu ler o que prometeu medir.
      - name: Fim de linha, medido neste runner
        run: npm run --silent fim-de-linha

      - name: Verificação de tipos
        run: npx tsc --noEmit

      # As 9 regras LGPD são comportamento testado, não comentário no código.
      # Um teste vermelho reprova o build inteiro. Nenhuma etapa deste arquivo
      # tolera falha, e a palavra que faria isso não aparece nele — de propósito,
      # para que uma varredura simples confirme a ausência.
      - name: Testes
        run: npm test
