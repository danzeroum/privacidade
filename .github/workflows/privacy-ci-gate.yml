# Gate de privacidade (PR 11) — o que o C-18 prometeu para depois.
#
# O gate mínimo (`ci.yml`) prova que compila e que as nove regras passam. Este
# prova outra coisa: que **este repositório** não publica dado pessoal fora do
# inventário sintético declarado, não trata campo fora do catálogo declarado e
# não marca princípio de PbD sem evidência.
#
# O escopo é o repositório inteiro (PR 4, Risco-003), e não mais só os caminhos
# de log: a varredura de PII lê todo arquivo de texto e o relatório imprime
# quantos leu, quantos eram log, quantos binários pulou e quais diretórios ficou
# de fora. Enquanto o número era 1, "nenhum achado" era uma frase verdadeira
# sobre um recorte que ninguém tinha percebido — que é a forma mais confortável
# de um controle falhar. O denominador entra no relatório por isso.
#
# A varredura de **campo fora do catálogo** continua restrita a log, e é medição
# e não preguiça: aplicada ao repositório inteiro ela produz 24.290 achados sobre
# 2.772 identificadores, porque `campo:` em TypeScript é declaração de variável e
# não registro escrito.
#
# A regra que separa este arquivo de um linter de texto: ele barra por
# **evidência**. Não procura a palavra "privacidade" no PR, não conta linhas de
# documentação e não confia em marcação. Toda reprovação cita arquivo e linha, e
# pode ser conferida à mão por quem lê o diff — se não pudesse, seria opinião.
#
# Falha fechada: repositório sem `.privacy/` reprova em vez de passar por
# omissão, e inventário ilegível reprova em vez de virar lista vazia.
#
# Como no `ci.yml`, nenhuma etapa aqui tolera falha, e a palavra que faria isso
# não aparece no arquivo — de propósito, para que uma varredura simples confirme
# a ausência. E, como lá, enquanto o job não estiver marcado como *required
# status check* na proteção da `main`, ele informa o vermelho sem impedir o
# merge: a marcação é configuração do repositório, não commit.
#
# A regra roda em `app/src/lib/gate-privacidade.ts` e é exercitada por teste
# (`app/tests/regras.test.tsx`). Gate cuja lógica só existe dentro do YAML é
# gate que ninguém consegue rodar em casa nem provar que reprova o que deveria.
name: Gate de privacidade

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: privacidade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacidade:
    name: PII, catálogo e PbD
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: app

      # A raiz varrida é o repositório inteiro, não `app/`: o gate olha o que o
      # repositório publica, e o protótipo é só uma parte dele.
      - name: Varredura de privacidade
        run: npm run gate:privacidade
        working-directory: app

      # Risco-036 — metade desta prova só existe no artefato construído: depois
      # da minificação os nomes de constante somem, e o que sobrevive é o texto
      # do segredo. Por isso o build vem antes, e a varredura reprova se o
      # `dist/` não existir — aprovar por não ter olhado é o Risco-003 com outro
      # nome.
      - name: Construir o artefato
        run: npm run build
        working-directory: app

      - name: Varredura de segredo estático
        run: npm run varredura:segredos
        working-directory: app

      # RIPD §7.3 — as quatro premissas de aceite viram condição de build. O
      # artefato de produção é gerado com `--mode producao`, que carrega o
      # `.env.producao` com `VITE_PERFIL`, e varrido: se
      # encontrar modo demonstração, rota de forja, papel por botão ou PII
      # sintética, reprova nomeando o risco, o arquivo e a linha.
      #
      # Nota deliberada: o artefato varrido aqui **não** é o que a demonstração
      # publica. O perfil de demonstração continua carregando as quatro coisas,
      # de propósito — é o que ele existe para mostrar.
      - name: Catraca das premissas de aceite
        run: npm run catraca:producao
        working-directory: app
