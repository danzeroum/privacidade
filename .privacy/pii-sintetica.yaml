# E-mail é declarado por **domínio**, e não valor a valor, porque o que torna um
# endereço sintético é o domínio não roteável — não a parte antes do arroba.
# Declarar dezenove endereços produziria churn de fixture sem acrescentar uma
# única garantia: `ana.silva@` e `bia.l@` são igualmente inofensivos enquanto o
# domínio não existir. A catraca continua fechada no que importa: um domínio
# novo — inclusive um domínio real — reprova até ser declarado aqui.
email:
  dominios:
    - dominio: exemplo.test
      motivo: >-
        Titulares fictícios dos três cenários e do protótipo. `.test` é TLD
        reservado pela RFC 2606: não resolve, não roteia e não pode ser
        registrado por ninguém. O PR 4 migrou estes endereços de `exemplo.com`,
        que **é** um domínio registrável — uma mensagem enviada por engano para
        lá chegaria a alguém, e "é só um exemplo" não é uma garantia técnica.
      onde:
        - app/src/mock/scenarios.ts
        - app/tests/regras.test.tsx
        - prototipo/index.html
        - docs/design_handoff_lastro_correcoes/

    - dominio: creditoia.example
      motivo: >-
        Atores internos da organização fictícia do seed (DPO, encarregado,
        analistas, remetente de notificação). `.example` é reservado pela mesma
        RFC 2606.
      onde: [db/seed.sql]
