# Inventário fechado da PII sintética que este repositório publica (Risco-003).
#
# Até o PR 4 o gate varria **um** arquivo — o log de exemplo — e aprovava com 45
# CPFs formatados espalhados por 7 arquivos de fonte, teste, SQL, HTML e
# documentação. Nenhum deles era segredo: são titulares fictícios de cenário de
# demonstração. O problema nunca foi a existência deles, foi **ninguém saber que
# existiam**, e a folga ter crescido de 40 para 45 enquanto o relatório dizia
# "nenhum achado".
#
# A regra que dá sentido a este arquivo é a mesma do inventário de campos:
# declarar é ato explícito e visível no diff. Um CPF novo em `regras.test.tsx`
# — arquivo que já tem 28 declarados — reprova o merge até alguém escrever aqui
# qual é o valor, por que ele existe e onde pode aparecer. É a catraca que
# faltou nos PRs anteriores, e que deixou eu mesmo acrescentar cinco.
#
# Quatro coisas reprovam, e vale nomeá-las porque é onde uma declaração costuma
# virar carta-branca:
#
#   1. valor não declarado, em qualquer arquivo do repositório;
#   2. valor declarado aparecendo **fora** dos caminhos declarados em `onde` —
#      declaração não é passe livre global;
#   3. declaração morta: valor que não existe mais em lugar nenhum. Lista que
#      ninguém confere apodrece, e apodrecida ela passa a autorizar o que não
#      está mais lá;
#   4. este arquivo ausente ou ilegível — como o inventário de campos, ausência
#      não é aprovação.
#
# Este arquivo é, ele próprio, caminho implícito de tudo o que declara: não há
# como declarar um valor sem escrevê-lo. Não é exceção escondida — é a única
# forma de a lista existir, e ela está inteira no diff.
#
# ## Dígito verificador
#
# Dez dos onze CPFs abaixo falham no dígito verificador; nenhum é válido. Isso é
# higiene, **não é o critério**: o gate reprova CPF válido e inválido igual, e
# quem decide o que passa é esta lista. Um documento estruturalmente impossível
# continua sendo um padrão que não deve entrar em log, e tratar "inválido" como
# "pode" transformaria o gate num validador de dígito com outro nome.
#
# O PR 4 substituiu, em cinco arquivos, o único CPF do repositório que passava no
# dígito verificador — o número de tutorial que todo exemplo brasileiro usa. Um
# documento estruturalmente válido pode pertencer a alguém, e "é o exemplo de
# todo mundo" é precisamente o argumento que uma auditoria não aceita de
# ninguém. O valor antigo não é repetido aqui: declarar o que saiu seria
# reintroduzi-lo. Quem quiser conferir lê o diff, que é onde ele está.
repositorio: danzeroum/privacidade

